name: test

on:
  push:
  pull_request:

jobs:
  test:
    name: Test against ${{ matrix.name }}
    runs-on: ubuntu-latest

    # This client targets two server lineages and must keep working on both.
    # Upstream is the compatibility floor: it has no /operations endpoints, so
    # everything that uses them must skip rather than fail there. The fork adds
    # them, and is where that code is actually exercised. Running the same
    # suite against both is what stops one lineage's behaviour being baked in
    # as an assumption.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: upstream Piston
            image: ghcr.io/engineer-man/piston
          - name: the Piston fork
            image: ghcr.io/milindmadhukar/piston

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Piston needs --privileged and cgroup v2. Upstream runs its own API this
      # way on ubuntu-latest runners, so this is a supported configuration.
      - name: Start Piston
        run: |
          # /piston must be mounted: without it the image's entrypoint fails
          # with "chown: cannot access '/piston'" and the API never starts.
          mkdir -p "${{ runner.temp }}/piston-data"
          docker run -d \
            --privileged \
            -p 2000:2000 \
            --tmpfs /tmp:exec \
            -v "${{ runner.temp }}/piston-data:/piston" \
            --name piston \
            "${{ matrix.image }}"

      - name: Wait for Piston
        run: |
          # A plain `curl --retry` is not enough here: while Docker's port
          # proxy is listening but the API is not yet up, the connection is
          # reset rather than refused, and --retry-connrefused does not cover
          # that.
          for _ in $(seq 1 60); do
            if curl --silent --fail http://localhost:2000/api/v2/runtimes > /dev/null 2>&1; then
              echo "Piston is ready."
              exit 0
            fi
            sleep 2
          done
          echo "Piston did not become ready in time."
          docker logs piston
          exit 1

      # The instance starts with no runtimes installed, so install the one the
      # execution tests need. Tests for languages that are not installed skip
      # themselves.
      - name: Install the python runtime
        run: |
          curl --silent --show-error --fail \
            -X POST http://localhost:2000/api/v2/packages \
            -H 'Content-Type: application/json' \
            -d '{"language":"python","version":"3.10.0"}'
          curl --silent --show-error --fail http://localhost:2000/api/v2/runtimes

      # Building the examples is already covered by `go build ./...`. Running
      # them is what catches an example that compiles but is wrong. They all
      # target http://localhost:2000/api/v2/, which is exactly what this job
      # publishes.
      - name: Run examples
        run: |
          failed=""
          for dir in examples/*/; do
            name=$(basename "$dir")

            # Targets the whitelist-only official API, so it exits non-zero
            # without a key. Left honest rather than weakened to exit 0.
            if [ "$name" = "official_api_client" ]; then
              echo "--- skipping $name (needs an official API key)"
              continue
            fi

            echo "--- running $name"
            # From its own directory: from_files reads main.py/test.py
            # relative to the working directory.
            if ! (cd "$dir" && go run .); then
              echo "!!! $name failed"
              failed="$failed $name"
            fi
          done

          if [ -n "$failed" ]; then
            echo "Examples failed:$failed"
            exit 1
          fi

      - name: Test
        env:
          PISTON_BASE_URL: http://localhost:2000/api/v2/
          # Exercise install/uninstall too. Safe here: the instance is
          # ephemeral, and bash is small enough to install quickly.
          PISTON_TEST_PACKAGE_MANAGEMENT: "true"
          # Pinned rather than bare "bash" so the test resolves the version
          # locally instead of listing every package, which makes the instance
          # fetch the upstream index.
          PISTON_TEST_PACKAGE: bash=5.2.0
        # The operations tests probe the instance and skip when it does not
        # serve those endpoints, so this same command is correct for both
        # images: a skip on upstream, a run on the fork. A failure there means
        # the probe is wrong, not that the image is old.
        run: go test ./... -v

      - name: Piston logs
        if: always()
        run: docker logs piston

  test-official-api:
    name: Test against the official Piston API
    runs-on: ubuntu-latest
    env:
      PISTON_API_KEY: ${{ secrets.PISTON_API_KEY }}

    steps:
      # The official API is whitelist-only. Without a PISTON_API_KEY repository
      # secret — including on pull requests from forks, which never receive
      # secrets — every step below is skipped rather than failed, and the
      # self-hosted job above remains the source of truth.
      - name: Report whether an API key is configured
        run: |
          if [ -z "$PISTON_API_KEY" ]; then
            echo "No PISTON_API_KEY secret set; skipping the official-API tests."
          else
            echo "PISTON_API_KEY is set; running the official-API tests."
          fi

      - uses: actions/checkout@v4
        if: env.PISTON_API_KEY != ''

      - uses: actions/setup-go@v5
        if: env.PISTON_API_KEY != ''
        with:
          go-version-file: go.mod

      - name: Test
        if: env.PISTON_API_KEY != ''
        run: go test ./... -v
